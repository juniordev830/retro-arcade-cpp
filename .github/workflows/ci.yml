name: C++ CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile with warnings
        run: g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror main.cpp -o arcade_engine
      - name: Run smoke test
        run: ./arcade_engine
