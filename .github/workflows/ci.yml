name: C++ CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compile with warnings
        run: g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror main.cpp -o arcade_engine
      - name: Run smoke test
        run: ./arcade_engine
      - name: Compile regression tests with warnings
        run: g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror tests/test_core.cpp -o test_core
      - name: Run regression tests
        run: ./test_core
